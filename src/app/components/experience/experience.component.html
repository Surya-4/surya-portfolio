<section id="experience" class="section-pad">

  <div #revealEl>
    <p class="section-label">Work History</p>
    <h2 class="section-title">EXPERIENCE</h2>
  </div>

  <div class="timeline">
    <div
      class="timeline-item reveal"
      #revealEl
      *ngFor="let exp of data.experiences; let i = index"
      [style.transition-delay]="(i * 0.15) + 's'"
    >
      <div class="timeline-meta">
        <span class="period">{{ exp.period }}</span>
        <span class="company-name">{{ exp.company }}</span>
      </div>

      <div class="timeline-axis">
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <div class="timeline-card">
        <h3 class="role">{{ exp.role }}</h3>
        <div class="meta-row">
          <span>{{ exp.company }}</span>
          <span class="sep">·</span>
          <span>{{ exp.location }}</span>
          <span class="sep">·</span>
          <span class="badge-type">{{ exp.type }}</span>
        </div>
        <ul class="bullets">
          <li *ngFor="let b of exp.bullets">{{ b }}</li>
        </ul>
      </div>
    </div>
  </div>

</section>
